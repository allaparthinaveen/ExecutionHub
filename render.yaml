services:
  - type: web
    name: tradeservices-api
    env: python
    plan: free
    buildCommand: cd trading_engine && pip install -r requirements.txt
    startCommand: cd trading_engine && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: ANGEL_ONE_API_KEY
        sync: false
      - key: ANGEL_ONE_CLIENT_CODE
        sync: false
      - key: ANGEL_ONE_PASSWORD
        sync: false
      - key: ANGEL_ONE_TOTP_SECRET
        sync: false
